# Local development environment, integration-test substrate, and the
# self-hosting story — deliberately the same file for all three, so the
# thing we test against is the thing someone else would run.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postilla
      POSTGRES_PASSWORD: postilla
      POSTGRES_DB: postilla
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postilla -d postilla']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outbound mail locally so notification work never risks a real send.
  # Web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres-data:
