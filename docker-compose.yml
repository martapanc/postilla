# Local development and integration-test environment.
#
# NOT a production configuration: the database trusts every connection and
# holds throwaway data. A real deployment needs a real password, TLS, and
# backups — see docs/adr and the deployment notes in the README.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postilla
      POSTGRES_DB: postilla
      # Passwordless on purpose. Committing a literal password — even a fake
      # one — trains people to ignore secret-scanner alerts, and the port is
      # bound to loopback below, so nothing off this machine can reach it.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # Loopback only. A bare '5432:5432' would publish a trust-auth database
      # to the whole local network.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postilla -d postilla']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outbound mail locally so notification work never risks a real send.
  # Web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres-data:
